# ──────────────────────────────────────────────────────────────────────────────
# Broadcast SN Remote Call — hôte virtuel
#
# ${SERVER_NAME} est substitué au démarrage du conteneur.
# Les certificats sont attendus dans ./certs :
#   certs/fullchain.pem  et  certs/privkey.pem
# ──────────────────────────────────────────────────────────────────────────────

upstream snrc_app {
  server app:3000;
  keepalive 32;
}

# HTTP : uniquement le renouvellement ACME et la redirection vers HTTPS.
server {
  listen 80;
  listen [::]:80;
  server_name ${SERVER_NAME};

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ${SERVER_NAME};

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;

  # HSTS : HTTPS est obligatoire. getUserMedia ne fonctionne de toute façon pas
  # sur une origine non sécurisée, hors localhost.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  limit_conn snrc_conn 40;

  # ── Flux d'événements applicatifs (SSE) ────────────────────────────────────
  # La mise en tampon doit être désactivée, sinon les événements n'arrivent
  # qu'une fois le tampon plein — c'est-à-dire jamais, pour un flux continu.
  location ~ ^/api/sessions/[^/]+/stream$ {
    proxy_pass http://snrc_app;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    chunked_transfer_encoding off;
    proxy_read_timeout 24h;
  }

  # ── Authentification : limitation de débit renforcée ───────────────────────
  location = /api/auth/login {
    limit_req zone=snrc_login burst=5 nodelay;
    proxy_pass http://snrc_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Page de sortie vMix ────────────────────────────────────────────────────
  # Jamais mise en cache : la révocation doit prendre effet au rechargement.
  location ~ ^/output/ {
    proxy_pass http://snrc_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # ── Ressources statiques compilées ─────────────────────────────────────────
  location /_next/static/ {
    proxy_pass http://snrc_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Ces fichiers portent une empreinte dans leur nom : immuables.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # ── Tout le reste ──────────────────────────────────────────────────────────
  location / {
    limit_req zone=snrc_general burst=40 nodelay;
    proxy_pass http://snrc_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }

  # L'API vMix ne doit JAMAIS être relayée par ce serveur. Ce bloc est une
  # protection contre un ajout ultérieur distrait.
  location ~ ^/(api/)?vmix-passthrough {
    return 403;
  }
}
