user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Le flux d'événements (SSE) maintient une connexion ouverte par console et par
  # correspondant : le journal doit rester lisible malgré ces longues requêtes.
  log_format snrc '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent rt=$request_time '
                  '"$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log snrc;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  types_hash_max_size 2048;
  server_tokens off;

  # Les liens d'invitation sont longs ; les en-têtes aussi.
  large_client_header_buffers 4 16k;
  client_max_body_size 2m;

  keepalive_timeout 75s;
  # Un flux SSE dure toute l'émission : sans ces valeurs, Nginx le couperait.
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css application/json application/javascript
             application/x-javascript text/xml application/xml image/svg+xml;
  # Jamais sur text/event-stream : la compression introduirait un tampon.

  # Limitation de débit en bordure, complémentaire à celle de l'application.
  limit_req_zone $binary_remote_addr zone=snrc_login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=snrc_general:10m rate=120r/m;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=snrc_conn:10m;

  include /etc/nginx/conf.d/*.conf;
}
